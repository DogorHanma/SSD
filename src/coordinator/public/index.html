<!DOCTYPE html>
<html>
<head>
    <title>Coordinator Panel</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1>Mini Server Orchestrator</h1>

        <div class="create-box">
            <input id="nameInput" placeholder="Server name" />
            <button id="createBtn">Create</button>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <a href="election.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">➔ Ir al Panel de Elección de Líder</a>
        </div>

        <div class="list-head">
            <h2>Active Servers</h2>
            <div class="list-actions">
                <span id="lastUpdate"></span>
                <button id="reloadBtn">Reload</button>
            </div>
        </div>

        <ul id="serverList"></ul>

        <!-- ==================== TASK PANEL ==================== -->
        <div class="task-panel">
            <div class="task-panel-header">
                <h2>⚡ Task Assignment</h2>
                <button id="refreshWorkersBtn" class="btn-ghost">Refresh Workers</button>
            </div>

            <!-- Worker selector -->
            <div class="task-form">
                <div class="task-form-row">
                    <label>Worker</label>
                    <select id="workerSelect">
                        <option value="">— Cargando workers —</option>
                    </select>
                </div>

                <div class="task-form-row">
                    <label>Capability</label>
                    <select id="capabilitySelect">
                        <option value="">— Selecciona un worker —</option>
                    </select>
                </div>

                <!-- Payload dinámico -->
                <div id="payloadArea" class="task-form-payload" style="display:none;"></div>

                <button id="sendTaskBtn" class="btn-task" disabled>Enviar Tarea</button>
            </div>

            <!-- Historial -->
            <div class="task-history-head">
                <h3>Historial de Tareas</h3>
                <button id="refreshTasksBtn" class="btn-ghost">Actualizar</button>
            </div>

            <div id="taskList" class="task-list">
                <p class="empty-hint">No hay tareas aún.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
