<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Console | SSD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1 id="serverName"></h1>
        <p id="serverPort"></p>

        <div class="field">
            <label for="parentInput">Coordinador padre</label>
            <div class="row">
                <input id="parentInput" placeholder="http://ip:3000" />
                <button id="parentBtn">Switch</button>
            </div>
            <p id="parentStatus" class="hint"></p>
        </div>

        <div class="field">
            <label for="messageInput">Mensaje</label>
            <div class="row">
                <input id="messageInput" placeholder="Escribe un mensaje" />
                <button id="sendBtn">Send</button>
            </div>
            <p id="status" class="hint"></p>
        </div>

        <button id="shutdownBtn">Shutdown</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
